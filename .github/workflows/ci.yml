name: BISP

on:
  push:
    branches: [ main, master ]

env:
  API_IMAGE_NAME: booking-backend
  API_CONTAINER_NAME: booking-backend
  API_PORT: 3000:3000
  REPO_NAME: ismoil-js/booking-backend
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1 · Build Docker image and push to GHCR
  # ────────────────────────────────────────────────────────
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.API_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.API_IMAGE_NAME }}:buildcache,mode=max

  # ────────────────────────────────────────────────────────
  # Job 2 · SSH into server and deploy
  # ────────────────────────────────────────────────────────
  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Pass all secrets as env vars so special characters don't break bash
          envs: >-
            GH_TOKEN,GH_ACTOR,
            DB_PASSWORD,
            JWT_SECRET,
            GEMINI_API_KEY,
            STRIPE_SECRET_KEY,
            STRIPE_SUCCESS_URL,
            STRIPE_CANCEL_URL,
            PLATFORM_FEE_PERCENT,
            GOOGLE_CLIENT_ID,
            MAIL_ENABLED,
            SMTP_HOST,SMTP_PORT,SMTP_SECURE,
            SMTP_USER,SMTP_PASS,MAIL_FROM
          env:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
            GH_ACTOR: ${{ github.actor }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_SUCCESS_URL: ${{ secrets.STRIPE_SUCCESS_URL }}
            STRIPE_CANCEL_URL: ${{ secrets.STRIPE_CANCEL_URL }}
            PLATFORM_FEE_PERCENT: ${{ secrets.PLATFORM_FEE_PERCENT }}
            GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
            MAIL_ENABLED: ${{ secrets.MAIL_ENABLED }}
            SMTP_HOST: ${{ secrets.SMTP_HOST }}
            SMTP_PORT: ${{ secrets.SMTP_PORT }}
            SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
            SMTP_USER: ${{ secrets.SMTP_USER }}
            SMTP_PASS: ${{ secrets.SMTP_PASS }}
            MAIL_FROM: ${{ secrets.MAIL_FROM }}
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}"
            NETWORK="booking-network"
            DB_CONTAINER="booking-db"
            APP_CONTAINER="${{ env.API_CONTAINER_NAME }}"
            DB_NAME="bisp"
            DB_USER="postgres"

            # ── 1. Login to GHCR ──────────────────────────────────
            echo "==> Login to GHCR"
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # ── 2. Pull new app image ─────────────────────────────
            echo "==> Pull new image"
            docker pull "$IMAGE"

            # ── 3. Create shared Docker network ───────────────────
            echo "==> Create network"
            docker network create "$NETWORK" || true

            # ── 4. Start PostgreSQL (booking-db) if not running ───
            echo "==> Start database container"
            if ! docker ps --format '{{.Names}}' | grep -q "^${DB_CONTAINER}$"; then
              docker volume create booking_db_data || true
              docker run -d \
                --name "$DB_CONTAINER" \
                --network "$NETWORK" \
                --restart unless-stopped \
                -v booking_db_data:/var/lib/postgresql/data \
                -e POSTGRES_DB="$DB_NAME" \
                -e POSTGRES_USER="$DB_USER" \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                postgres:16-alpine
              echo "==> Waiting for Postgres to be ready..."
              sleep 5
            else
              echo "==> Database already running, skipping"
            fi

            # ── 5. Stop and remove old app container ──────────────
            echo "==> Remove old app container"
            docker stop "$APP_CONTAINER" || true
            docker rm   "$APP_CONTAINER" || true

            # ── 6. Create uploads volume ──────────────────────────
            docker volume create bisp_uploads || true

            # ── 7. Run new app container ──────────────────────────
            echo "==> Run new container"
            docker run -d \
              --name "$APP_CONTAINER" \
              --network "$NETWORK" \
              --restart unless-stopped \
              -p "${{ env.API_PORT }}" \
              -v bisp_uploads:/app/uploads \
              -e DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_CONTAINER}:5432/${DB_NAME}" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              -e STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
              -e STRIPE_SUCCESS_URL="$STRIPE_SUCCESS_URL" \
              -e STRIPE_CANCEL_URL="$STRIPE_CANCEL_URL" \
              -e PLATFORM_FEE_PERCENT="$PLATFORM_FEE_PERCENT" \
              -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              -e MAIL_ENABLED="$MAIL_ENABLED" \
              -e SMTP_HOST="$SMTP_HOST" \
              -e SMTP_PORT="$SMTP_PORT" \
              -e SMTP_SECURE="$SMTP_SECURE" \
              -e SMTP_USER="$SMTP_USER" \
              -e SMTP_PASS="$SMTP_PASS" \
              -e MAIL_FROM="$MAIL_FROM" \
              "$IMAGE"

            # ── 8. Cleanup old images ─────────────────────────────
            echo "==> Cleanup old unused images"
            docker image prune -f

            echo "==> Deploy complete"
